name: Test & Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libportaudio2
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -v
      - run: python -m securevoice.benchmark

  build-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm SecureVoice.spec
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist/SecureVoice/
          Compress-Archive -Path dist/SecureVoice -DestinationPath SecureVoice-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SecureVoice-Windows
          path: SecureVoice-Windows.zip
      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SecureVoice-Windows.zip
